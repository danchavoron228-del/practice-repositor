name: Java CI

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn clean compile test package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  sast:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          docker run --rm -v "${PWD}:/src" returntocorp/semgrep semgrep ci --config auto --sarif --output /src/results.sarif || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
        continue-on-error: true

  sca:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check
      - name: Upload SCA Report
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: target/dependency-check-report.html

  dast-baseline:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target
      - name: Create ZAP rules file
        run: echo "" > zap-rules.tsv
      - name: Run app
        run: |
          java -jar target/*.jar > app.log 2>&1 &
          echo "Waiting for app to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "App is ready"
              break
            fi
            echo "Attempt $i: waiting..."
            sleep 2
          done
          echo "App started"
      - name: Verify app is running
        run: |
          echo "Checking if app is reachable..."
          curl -v http://localhost:8080 || echo "CURL FAILED"
          netstat -tulpn | grep 8080 || echo "PORT 8080 NOT LISTENING"
          ps aux | grep java || echo "JAVA NOT RUNNING"
      - name: Debug app log if failed
        if: failure()
        run: cat app.log || true
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: 'zap-rules.tsv'

  dast-api:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target
      - name: Create ZAP rules file
        run: echo "" > zap-rules.tsv
      - name: Run app
        run: |
          java -jar target/*.jar > app.log 2>&1 &
          echo "Waiting for app to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "App is ready"
              break
            fi
            echo "Attempt $i: waiting..."
            sleep 2
          done
          echo "App started"
      - name: Verify app is running
        run: |
          echo "Checking if app is reachable..."
          curl -v http://localhost:8080 || echo "CURL FAILED"
          netstat -tulpn | grep 8080 || echo "PORT 8080 NOT LISTENING"
          ps aux | grep java || echo "JAVA NOT RUNNING"
      - name: Debug app log if failed
        if: failure()
        run: cat app.log || true
      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'http://localhost:8080/v3/api-docs'
          rules_file_name: 'zap-rules.tsv'