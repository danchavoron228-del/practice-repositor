name: ZAP Fuzzing Scan

on:
  push:
    branches: [ "feature/fuzzing-github" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  zap-full-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and run Spring Boot app
        run: |
          mvn clean package -DskipTests
          nohup java -jar target/*.jar > app.log 2>&1 &
          echo "Waiting for app to start..."
          sleep 60

      - name: Диагностика — проверим, что приложение работает
        run: |
          echo "=== Проверяем进程 ==="
          ps aux | grep java
          echo "=== Проверяем порт 8080 ==="
          netstat -tulpn | grep 8080 || echo "Порт 8080 не слушается"
          echo "=== Пробуем curl ==="
          curl -v http://localhost:8080 || echo "CURL не смог подключиться"
          echo "=== Последние строки лога приложения ==="
          tail -50 app.log

      - name: Run ZAP Full Scan
        run: |
          docker run --rm -v $(pwd):/zap/wrk:rw \
            --network=host \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://localhost:8080 \
            -r fuzzing_report.html \
            -J fuzzing_report.json \
            -w fuzzing_report.md

      - name: Оставить комментарий в PR с результатами
        if: always()
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🔍 Результаты ZAP Fuzzing Scan
            
            Сканирование завершено. Отчёты:
            - `fuzzing_report.html`
            - `fuzzing_report.json`
            - `fuzzing_report.md`
            
            *Для просмотра отчёта скачайте файлы из логов билда*