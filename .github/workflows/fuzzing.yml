name: ZAP Fuzzing Scan

on:
  push:
    branches: [ "feature/fuzzing-github" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  zap-full-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and run Spring Boot app
        run: |
          mvn clean package -DskipTests
          nohup java -jar target/*.jar &
          sleep 60

      - name: Run ZAP Full Scan и сохранить отчёт в файл
        run: |
          docker run --rm -v $(pwd):/zap/wrk:rw -t ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t http://localhost:8080 \
            -r fuzzing_report.html \
            -J fuzzing_report.json \
            -w fuzzing_report.md

      - name: Прочитать отчёт и сохранить в переменную
        id: report
        run: |
          if [ -f fuzzing_report.md ]; then
            REPORT_CONTENT=$(cat fuzzing_report.md)
            # Ограничиваем длину комментария (GitHub не позволяет >65536 символов)
            REPORT_CONTENT="${REPORT_CONTENT:0:60000}"
            echo "report_content<<EOF" >> $GITHUB_OUTPUT
            echo "$REPORT_CONTENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "report_content=No report generated" >> $GITHUB_OUTPUT
          fi

      - name: Оставить комментарий в PR с результатами
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🔍 Результаты ZAP Fuzzing Scan
            
            ${{ steps.report.outputs.report_content }}
