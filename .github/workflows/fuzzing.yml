name: ZAP Fuzzing Scan

on:
  push:
    branches: [ "feature/fuzzing-github" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-run-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build and run app
        run: |
          mvn clean package -DskipTests
          nohup java -jar target/*.jar &

      - name: Wait for app
        run: sleep 30

  zap-fuzzing:
    runs-on: ubuntu-latest
    needs: build-and-run-app
    steps:
      - name: Run ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.8.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:8080'
          fail_action: false
          artifact_name: 'zap-fuzzing-report'