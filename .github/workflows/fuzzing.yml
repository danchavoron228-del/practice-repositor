name: ZAP Fuzzing Scan

on:
  push:
    branches: [ "feature/fuzzing-github" ]
  pull_request:
    branches: [ "main" ]

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Start simple web server
        run: |
          python3 -m http.server 8080 &
          sleep 5
          curl http://localhost:8080

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.9.0
        with:
          target: 'http://localhost:8080'
          fail_action: false
          artifact_name: 'zap_report'